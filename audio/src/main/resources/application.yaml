spring:
  application:
    name: nostalgiaana-audio

  datasource:
    url: ${DB_NAME:jdbc:postgresql://localhost:5432/nostalgiaana?options=-c%20timezone%3DUTC}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:nostalgiaana123}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Explicit, small values rather than HikariCP's defaults (10/10) —
      # this app is a single free-tier Render instance sitting behind
      # Supabase's own free-tier PgBouncer pooler, which has a low shared
      # connection cap; a rolling deploy briefly runs old+new instances
      # together, so this must stay small enough that 2x this value still
      # fits comfortably under the pooler's limit.
      maximum-pool-size: 5
      minimum-idle: 2
      data-source-properties:
        # Enforced here (not just as a DB_NAME query param) so it applies
        # regardless of what URL is typed into a hosting dashboard.
        # Supabase's transaction-mode PgBouncer pooler doesn't support the
        # pgjdbc driver's server-side prepared statement cache — without
        # this, queries after the pool warms up fail with
        # "prepared statement already exists".
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    url: ${DB_NAME:jdbc:postgresql://localhost:5432/nostalgiaana?options=-c%20timezone%3DUTC}
    user: ${DB_USER:postgres}
    password: ${DB_PASS:nostalgiaana123}
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Supabase's `public` schema isn't truly empty on a fresh project
    # (default extensions/objects), so Flyway's baseline-on-migrate
    # auto-triggers even against a brand-new database. Without this,
    # it baselines at version 1 by default and silently skips V1 (which
    # creates users/categories/content), breaking every later migration.
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: 8080
  tomcat:
    max-swallow-size: 2GB
  # Reverse-proxy hygiene for the production Caddy deployment: makes
  # HttpServletRequest.getScheme()/isSecure()/getServerName() reflect the
  # public https://api.<domain> the client actually used, not the internal
  # http://app:8080 Caddy forwards to. Nothing in this codebase currently
  # derives a URL from the inbound request, so this isn't functionally
  # required today, but it's free insurance for anything that does later
  # (redirects, secure-cookie flags, actuator self-links).
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET:nostalgiaana-super-secret-jwt-key-256-bits-long-enough}
  expiration: 86400000
  refresh-expiration: 604800000

minio:
  # Local dev talks to a local MinIO on these defaults; production sets
  # STORAGE_* to point at Cloudflare R2 (S3-compatible) instead — no code
  # changes needed, R2 is reached through the same MinioClient beans.
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  # Host embedded in every presigned URL handed to clients. For self-hosted
  # MinIO this would need to differ from `endpoint` above (internal Docker
  # hostname vs. externally-reachable domain) — but R2's S3 API endpoint is
  # already public, so it serves both roles. Deliberately NOT R2's separate
  # "public dev URL" feature (STORAGE_URL): that host is already scoped to
  # one bucket via its subdomain, so MinIO's path-style presigned URLs
  # (which embed the bucket name in the path) 404 against it — verified by
  # direct reproduction.
  public-endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET:minioadmin}
  # Production R2 uses a single bucket (nostalgiaana-media) for all four
  # content types, distinguished by key alone; local dev keeps the four
  # separate MinIO buckets it always had.
  bucket-audio: ${STORAGE_BUCKET:audio-content}
  bucket-covers: ${STORAGE_BUCKET:cover-images}
  bucket-video: ${STORAGE_BUCKET:video-content}
  bucket-profile-pictures: ${STORAGE_BUCKET:profile-pictures}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

cors:
  # Only exercised by a browser client (Flutter web) — native
  # Android/iOS/desktop builds never hit CORS. Comma-separated to allow
  # multiple origins.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

razorpay:
  key-id: rzp_test_placeholder
  key-secret: placeholder-secret
  webhook-secret: placeholder-webhook-secret

admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
    phone: "9987092587"
    phone2: "9867713970"
    country: India
    city: Chennai
    password: ${ADMIN_BOOTSTRAP_PASSWORD:AdminPassword123}
